<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Landing Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

body{
    background:#0f172a;
    color:#fff;
}

.hero{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
}

.container{
    max-width:700px;
}

h1{
    font-size:3rem;
    margin-bottom:15px;
}

p{
    font-size:1.1rem;
    color:#e2e8f0;
    margin-bottom:30px;
    line-height:1.6;
}

.btn{
    display:inline-block;
    padding:14px 30px;
    background:white;
    color:#2563eb;
    text-decoration:none;
    border-radius:50px;
    font-weight:600;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

@media(max-width:768px){
    h1{
        font-size:2.2rem;
    }
    p{
        font-size:1rem;
    }
}
</style>
</head>
<body>

<section class="hero">
    <div class="container">
        <h1>Build Something Amazing</h1>
        <p>Create stunning digital experiences with modern design, fast performance, and seamless responsiveness.</p>
        #Get Started</a>
    </div>
</section>

</body>
</html>
